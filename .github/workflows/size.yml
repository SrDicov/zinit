name: size

# Standalone binary-size budget (musl static). The `ci.yml` size job guards
# the total; this one guards each shippable binary at 2 MiB. Pre-Phase 3 there
# are no bin crates (`zinit`/`zctl`/`zcheck` are lib-only), so the job
# verifies infra and skips the gate with a notice instead of failing green
# code for binaries that do not exist yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  musl-size:
    name: musl size budget (2 MiB each)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-size-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-size-
      - name: Release build (musl static)
        run: cargo build --release --workspace --target x86_64-unknown-linux-musl
      - name: Enforce 2 MiB per binary (if present)
        run: |
          set -euo pipefail
          BUDGET=$(( 2 * 1024 * 1024 ))
          found=0
          for bin in target/x86_64-unknown-linux-musl/release/zinit \
                     target/x86_64-unknown-linux-musl/release/zctl \
                     target/x86_64-unknown-linux-musl/release/zcheck; do
            [ -f "$bin" ] || continue
            found=1
            bytes=$(stat -c%s "$bin")
            echo "$(basename "$bin"): $bytes bytes (budget $BUDGET)"
            if [ "$bytes" -gt "$BUDGET" ]; then
              echo "::error::$(basename "$bin") exceeds 2 MiB"
              exit 1
            fi
          done
          [ "$found" = 1 ] || echo "no shippable binaries yet (pre-Phase 3) — infra verified, gate skipped"
      - uses: actions/upload-artifact@v4
        with:
          name: musl-bins
          path: target/x86_64-unknown-linux-musl/release/z*
