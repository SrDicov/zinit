name: fuzz

# Continuous fuzzing: proxy on every parser PR, libFuzzer nightly.
#
# `fuzz/` is a detached crate (its own `[workspace]`), so libfuzzer-sys
# never enters the workspace dependency gate. Heavy by design: nightly +
# manual + parser PRs only, never every push.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/zconfig/src/parser.rs"
      - "crates/zconfig/src/value.rs"
      - "crates/zrt/src/**"
      - ".github/workflows/fuzz.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  mutation-tests:
    name: parser mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fuzz-
      - name: Parser no-panic suite (fuzz proxy)
        run: cargo test -p zconfig --release no_panic
      - name: Full zconfig suite
        run: cargo test -p zconfig --release

  cargo-fuzz:
    name: libFuzzer parser (nightly, 10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Nightly and manual only: needs nightly rustc and ~15 minutes of
    # machine. Parser PRs keep the proxy above; libFuzzer runs while we
    # sleep. libFuzzer needs no corpus to start, but the seeds in
    # `fuzz/seeds/` teach it the format on the first run.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Build fuzz target
        working-directory: fuzz
        run: cargo fuzz build -O parse_service
      - name: Fuzz the parser
        working-directory: fuzz
        run: cargo fuzz run parse_service seeds/parse_service -- -max_total_time=600 -max_len=65536
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/