name: release

# Automatic releases on `v*` tags. Builds the portable targets in parallel,
# packs whatever shippable binaries exist plus docs, and publishes with
# SHA256. Pre-Phase 3 the workspace is lib-only, so an empty bin set packs
# docs only — still a valid release of the design, never a failure.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-${{ matrix.target }}-
      - name: Build release
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          out="zinit-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$out"
          for b in zinit zctl zcheck; do
            f="target/${{ matrix.target }}/release/$b"
            [ -f "$f" ] && cp "$f" "$out/" || true
          done
          cp README.md LICENSE CHANGELOG.md "$out/" 2>/dev/null || true
          tar -czf "$out.tar.gz" "$out"
          sha256sum "$out.tar.gz" > "$out.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: "zinit-*.tar.gz*"

  publish:
    name: publish release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "zinit-*.tar.gz*"
          generate_release_notes: true
