name: release

# Distribution: static musl binaries for the two architectures CI executes
# natively (x86_64, aarch64). No cross linkers, no new dependencies — the
# same targets `ci.yml` already builds, only `--release` and packaged.
#
# A tag push (`v*`) builds, packs and publishes. `workflow_dispatch` builds
# and uploads artifacts without publishing, for pre-tag smoke tests.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-${{ matrix.target }}-

      - name: Build
        run: cargo build --release -p zinit -p zctl --target ${{ matrix.target }}

      - name: Verify static
        run: |
          file target/${{ matrix.target }}/release/zinit | tee /tmp/file-zinit
          grep -qE 'statically linked|static-pie linked' /tmp/file-zinit
          file target/${{ matrix.target }}/release/zctl | tee /tmp/file-zctl
          grep -qE 'statically linked|static-pie linked' /tmp/file-zctl

      - name: Package
        run: |
          tag="${GITHUB_REF_NAME:-untagged}"
          dir="zinit-${tag}-${{ matrix.target }}"
          mkdir -p "$dir"
          cp target/${{ matrix.target }}/release/zinit target/${{ matrix.target }}/release/zctl "$dir/"
          cp scripts/install.sh "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: zinit-*.tar.gz*

  publish:
    name: publish
    needs: artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes dist/zinit-*.tar.gz dist/zinit-*.sha256
