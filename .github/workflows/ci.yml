name: ci

# This workflow is the machine. `zcore` and `zconfig` build in about a second
# anywhere, but the moment `zrt` carries three reactor backends and the property
# tests get serious, local builds stop being free. Everything expensive is here.
#
# ── What this matrix has to prove ──────────────────────────────────────────
#
# Support is a claim, and a claim that is only ever tested on the machine that
# wrote the code is a wish. The axes below are the ones that have actually
# broken real init systems:
#
#   word size   32 vs 64. An init is a parade of `pid_t`, `uid_t`, `off_t` and
#               every `rlimit`. These are exactly the types that change width.
#               A truncation bug that compiles on x86_64 and traps on i686 or
#               armv7 cannot be found by hand on one machine.
#   ISA         x86, ARM, RISC-V. Not for performance - for the *syscall and
#               errno* differences. EACCES vs EPERM, `fd` width, atomic
#               availability, and which `kqueue` filters a kernel actually has.
#   libc        glibc vs musl. Not just a different implementation: glibc
#               exports symbols the kernel does not have, so code that links
#               on glibc and is missing on musl is code that breaks on Alpine,
#               Void, and every static-PIE appliance. This is a hard target,
#               not a nice-to-have.
#   toolchain   gcc / clang / lld as the *link driver*. Rust always uses LLVM
#               for codegen, so the honest axis is the driver that invokes the
#               linker and supplies the CRT objects - which differs in symbol
#               versioning, PIE defaults, and static-PIE support.
#   OS          the three BSDs, natively. A cross build proves the code
#               compiles; it cannot prove the kqueue backend works.
#
# ── How the axes are split ─────────────────────────────────────────────────
#
# Full cartesian would be 6 arch x 2 libc x 3 linkers x 4 OS = 144 jobs, which
# is both slow and a waste: the axes are nearly independent. So:
#
#   * `linux-native`   - runs the tests. Native, emulated or on an ARM runner.
#   * `linux-cross`    - builds only. Full tier-2 sweep, cheap.
#   * `linux-tier3`    - `cargo check` only, on nightly with `-Z build-std`.
#                        These targets have no prebuilt std, so a real build is
#                        not available to us; saying so here rather than
#                        quietly omitting them is the point.
#   * `linkers`        - the toolchain axis, on the host only.
#   * `freebsd`        - native on the main BSD, cross-check the rest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Warnings are errors everywhere. On a project this size the warnings are
  # ours, and a warning nobody reads is a warning that becomes a habit.
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # 1. Native Linux: build AND test.
  # ══════════════════════════════════════════════════════════════════════════
  linux-native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-glibc
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            components: clippy,rustfmt
          - name: x86_64-musl
            # Not optional. glibc hides missing syscalls behind symbol
            # versioning, so a glibc-only build is a build that has never been
            # tested on Alpine, Void, or a static appliance.
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            components: clippy,rustfmt
          - name: i686-glibc
            # 32-bit x86. The tier-2 i686 target.
            os: ubuntu-latest
            target: i686-unknown-linux-gnu
            components: clippy,rustfmt
          - name: i686-musl
            os: ubuntu-latest
            target: i686-unknown-linux-musl
            components: clippy,rustfmt
          - name: aarch64-glibc
            # A real ARM64 runner, so the tests actually execute on the ISA
            # rather than being emulated. `atomic` widths, `pid_t`, and errno
            # values all differ.
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            components: clippy,rustfmt
          - name: aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            components: clippy,rustfmt

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: ${{ matrix.components || '' }}

      - name: Install cross linker (i686)
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386
          echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=gcc" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-

      - name: Build
        run: cargo build --workspace --target ${{ matrix.target }} --all-targets

      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Clippy
        if: matrix.components != ''
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }}

      - name: Format
        if: matrix.components != ''
        run: cargo fmt --all --check

  # macOS aarch64: native runner, proves the kqueue backend compiles and the
  # workspace tests pass outside Linux. One job, not a matrix.
  macos:
    name: macos-aarch64
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-macos-
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets
      - run: cargo fmt --all --check

  # ══════════════════════════════════════════════════════════════════════════
  # 2. Cross-build the tier-2 glibc sweep. Build is the evidence; running
  #    is covered by the native job and by the BSD VMs.
  # ══════════════════════════════════════════════════════════════════════════
  linux-cross:
    name: cross ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: armv7-unknown-linux-gnueabihf, linker: arm-linux-gnueabihf-gcc, apt: gcc-arm-linux-gnueabihf }
          - { target: riscv64gc-unknown-linux-gnu, linker: riscv64-linux-gnu-gcc, apt: gcc-riscv64-linux-gnu }
          - { target: x86_64-unknown-linux-gnux32, linker: gcc, apt: gcc-multilib libc6-dev-i386, note: "x32 ABI: 64-bit registers, 32-bit pointers" }
          - { target: powerpc64le-unknown-linux-gnu, linker: powerpc64le-linux-gnu-gcc, apt: gcc-powerpc64le-linux-gnu }

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain
        # One package per leg. Ubuntu's cross gcc packages all declare
        # `Conflicts: gcc-multilib`, so installing the whole set at once is
        # unsatisfiable; only the x32 leg needs multilib (32-bit crt + libc).
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
          echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr a-z- A-Z_)_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Test compile only
        # `cargo test --no-run` compiles the test harnesses, which is where a
        # target-specific mistake in test code shows up. Running them needs
        # the ISA, and that is the native job's job.
        run: cargo test --workspace --target ${{ matrix.target }} --no-run

  # ══════════════════════════════════════════════════════════════════════════
  # 2b. Cross-build the musl sweep.
  #
  #    The CRT comes from rustup (`lib/rustlib/<t>/lib/self-contained/`, musl
  #    targets are `crt-static` by default), but the *link driver* must
  #    understand the target: the runner's x86_64 `/usr/bin/ld` chokes on
  #    ARM erratum flags (`--fix-cortex-a53-843419`) and rejects foreign
  #    objects outright. Each leg therefore installs its matching gnu cross
  #    gcc (a driver, not a libc — nothing glibc links in: `-nostartfiles
  #    -nodefaultlibs` with the self-contained sysroot) and points
  #    `CARGO_TARGET_*_LINKER` at it, the same per-leg pattern as `linux-cross`.
  #    (musl.cc cross toolchains were tried first and time out from GitHub's
  #    runners: "curl: (28) Failed to connect to musl.cc port 443".)
  # ══════════════════════════════════════════════════════════════════════════
  linux-musl-cross:
    name: musl ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: armv7-unknown-linux-musleabihf, apt: gcc-arm-linux-gnueabihf, linker: arm-linux-gnueabihf-gcc }
          - { target: aarch64-unknown-linux-musl, apt: gcc-aarch64-linux-gnu, linker: aarch64-linux-gnu-gcc }
          - { target: riscv64gc-unknown-linux-musl, apt: gcc-riscv64-linux-gnu, linker: riscv64-linux-gnu-gcc }

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install target-aware link driver
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
          echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr a-z- A-Z_)_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --workspace --target ${{ matrix.target }}

      - name: Test compile only
        run: cargo test --workspace --target ${{ matrix.target }} --no-run

  # ══════════════════════════════════════════════════════════════════════════
  # 3. Tier 3: no prebuilt std, so `cargo check` on nightly with -Z build-std.
  #
  #    These are listed rather than omitted. riscv32 Linux is a real target for
  #    embedded systems and we are not allowed to pretend it works by not
  #    mentioning it.
  # ══════════════════════════════════════════════════════════════════════════
  linux-tier3:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: riscv32gc-unknown-linux-gnu, note: "RISC-V 32-bit, RV32GC" }
          - { target: riscv32gc-unknown-linux-musl, note: "RISC-V 32-bit, musl" }
          - { target: i586-unknown-linux-gnu, note: "legacy 32-bit x86" }
          - { target: armv5te-unknown-linux-gnueabi, note: "pre-v6 ARM" }
          - { target: mipsel-unknown-linux-musl, note: "32-bit MIPS little-endian" }

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        # `targets:` is deliberately absent. `-Z build-std` compiles std from
        # `rust-src`, so the prebuilt `rust-std` for the target is never used
        # — and for a tier-3 target there is not one, so asking rustup for it
        # failed the whole step with "component 'rust-std' ... unavailable for
        # download". `rust-src` is the only component build-std needs.
        with:
          components: rust-src

      - name: Check with a hand-built std
        # NOTE: RUSTFLAGS is neutralized for this step on purpose. `-D warnings`
        # would also apply to the freshly-built std itself, and nightly std
        # routinely carries warnings that are not ours to fix. Our own code is
        # still denied warnings in every other job.
        env:
          RUSTFLAGS: ""
        run: |
          cargo +nightly check --workspace --target ${{ matrix.target }} \
            -Z build-std=std,core,alloc,panic_unwind \
            || cargo +nightly check --workspace --target ${{ matrix.target }} \
            -Z build-std=std,core,alloc,panic_abort

  # ══════════════════════════════════════════════════════════════════════════
  # 4. The toolchain axis: gcc / clang / lld as the link driver.
  #
  #    LLD is covered twice on purpose: once through the clang driver
  #    (`ld: lld`) and once as rust-lld itself. A bare rust-lld cannot be a
  #    link *driver* for this target, though: rustc picks the linker's flavour
  #    from the file name, so rust-lld must be invoked as `rust-lld -flavor
  #    gnu`, and the glibc target ships no CRT objects for it to start with -
  #    `rust-std` has `x86_64-unknown-linux-gnu/lib/self-contained/` empty.
  #    A cc driver in front of lld is not a workaround, it is the design: the
  #    CRT objects come from the distribution that owns them.
  # ══════════════════════════════════════════════════════════════════════════
  linkers:
    name: driver ${{ matrix.linker }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { linker: cc, cc: gcc, desc: "GNU ld, the distribution default" }
          - { linker: clang, cc: clang, desc: "GNU ld via the clang driver" }
          - { linker: clang, cc: clang, ld: lld, desc: "LLD via clang" }
          - { linker: clang, cc: clang, nonpie: true, desc: "non-PIE, for kernels built without relocation support" }

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang lld llvm
          gcc --version | head -1
          clang --version | head -1

      - name: Configure
        # NOTE: no embedded quotes in RUSTFLAGS. Cargo splits RUSTFLAGS on
        # whitespace itself; literal `"` characters become part of the
        # argument and rustc reports "multiple input filenames". None of the
        # paths here contain spaces, so quotes are unnecessary as well as
        # harmful.
        #
        # NOTE: `nonpie` is a flag, never `pie: false`. GitHub casts a missing
        # matrix key to 0 and `false` to 0, so `matrix.pie == false` is TRUE for
        # every leg that merely omits the key. All four legs were therefore
        # built `-C relocation-model=static` and then linked PIE, which is the
        # one combination rust-lld refuses.
        run: |
          set -euo pipefail
          case "${{ matrix.linker }}" in
            cc)    ln -sf "$(command -v gcc)"   "$RUNNER_TEMP/xlinker" ;;
            clang) ln -sf "$(command -v clang)" "$RUNNER_TEMP/xlinker" ;;
          esac
          {
            echo "RUSTFLAGS=-C linker=$RUNNER_TEMP/xlinker -C link-arg=-fuse-ld=${{ matrix.ld || 'bfd' }} ${{ matrix.nonpie && '-C relocation-model=static -C link-arg=-no-pie' || '' }}"
            # rustdoc drives its own link and reads RUSTDOCFLAGS, not
            # RUSTFLAGS, so without this the doctests are linked by whatever
            # the runner defaults to - the one thing this job is here to test.
            echo "RUSTDOCFLAGS=-C linker=$RUNNER_TEMP/xlinker -C link-arg=-fuse-ld=${{ matrix.ld || 'bfd' }}"
          } >> "$GITHUB_ENV"
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"

      - run: cargo build --workspace --all-targets
      - name: Test
        # The non-PIE leg skips doctests, and only there. rustdoc links them
        # itself without the `-C link-arg=-no-pie` above, so it would assemble
        # a PIE out of the deliberately non-PIC rlibs: guaranteed
        # `R_X86_64_32 ... recompile with -fPIC`. Every binary and every test
        # binary this leg is about still links non-PIE.
        run: ${{ matrix.nonpie && 'cargo test --workspace --lib --tests' || 'cargo test --workspace' }}

  # ══════════════════════════════════════════════════════════════════════════
  # 5. FreeBSD, OpenBSD, NetBSD.
  # ══════════════════════════════════════════════════════════════════════════
  bsd:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: freebsd-amd64
            runner: vmactions/freebsd-vm@v1
            version: "14.2"
            arch: amd64
          - name: freebsd-amd64-13
            runner: vmactions/freebsd-vm@v1
            version: "13.5"
            arch: amd64
          - name: openbsd-amd64
            runner: vmactions/openbsd-vm@v1
            version: "7.5"
          - name: netbsd-amd64
            runner: vmactions/netbsd-vm@v1
            version: "10.0"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          # The images are minimal and their package managers carry an ancient
          # Rust, so install the way a BSD user would: upstream toolchain,
          # $HOME, PATH. No sudo, nothing written outside the workspace.
          export RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal \
                          --component clippy,rustfmt --no-modify-path
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Environment
        shell: bash
        run: |
          uname -a
          cargo --version
          rustc --version
          sysctl -n hw.ncpu 2>/dev/null || nproc

      - name: Build
        shell: bash
        run: cargo build --workspace --all-targets

      - name: Test
        shell: bash
        run: cargo test --workspace

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets

  # Cross-check the other FreeBSD architectures from a Linux host. `check` is
  # all that is honest here: the point is that the source has no accidental
  # assumption about pointer width or endianness on those ISAs.
  bsd-cross:
    name: check ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-freebsd
          - riscv64gc-unknown-freebsd
          - i686-unknown-freebsd
          - armv7-unknown-freebsd
          - powerpc64-unknown-freebsd
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        # `targets:` is deliberately absent. `-Z build-std` compiles std from
        # `rust-src`, so the prebuilt `rust-std` for the target is never used
        # — and for a tier-3 target there is not one, so asking rustup for it
        # failed the whole step with "component 'rust-std' ... unavailable for
        # download". `rust-src` is the only component build-std needs.
        with:
          components: rust-src
      - name: Check
        # Same RUSTFLAGS neutralization as linux-tier3: `-D warnings` must not
        # leak into the hand-built std.
        #
        # `-Z build-std-features=panic_immediate_abort` is deliberately absent.
        # It used to be a no-op cfg passed down to the hand-built core; nightly
        # has since promoted it to a real panic strategy, so asking for it here
        # makes `core` itself refuse to compile ("panic_immediate_abort is now
        # a real panic strategy!") before zrt is ever reached. The workspace
        # already selects `panic = "abort"` per profile, which is the supported
        # way to get the same result.
        env:
          RUSTFLAGS: ""
        run: |
          cargo +nightly check --workspace --target ${{ matrix.target }} \
            -Z build-std=std,core,alloc,panic_unwind

  # ══════════════════════════════════════════════════════════════════════════
  # 6. The purity claims, asserted against the source rather than inferred
  #    from a build that would have succeeded anyway.
  # ══════════════════════════════════════════════════════════════════════════
  purity:
    name: the promises hold
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: The core cannot touch the outside world
        run: |
          set -euo pipefail
          for crate in zcore zconfig; do
            head -60 "crates/$crate/src/lib.rs" | grep -q '#!\[no_std\]' \
              || { echo "::error::$crate lost its #![no_std]"; exit 1; }
            head -60 "crates/$crate/src/lib.rs" | grep -q 'forbid(unsafe_code)' \
              || { echo "::error::$crate lost its #![forbid(unsafe_code)]"; exit 1; }
          done

      - name: The core has no dependencies
        # Not even libc. A `no_std` crate that links libc is a `no_std` crate
        # that will not build for a kernel, and this design intends to be
        # reviewable as "obviously cannot do I/O".
        run: |
          set -euo pipefail
          if grep -qE '^\s*[a-z0-9_-]+\s*=\s*' crates/zcore/Cargo.toml \
             | grep -vE 'version|edition|rust-version|license|repository|description|name'; then
            echo "::error::zcore gained a dependency; it must have none"
            cat crates/zcore/Cargo.toml
            exit 1
          fi

      - name: The runtime depends on libc and on nothing else
        run: |
          set -euo pipefail
          deps=$(grep -oE '^[a-z0-9_-]+' crates/zrt/Cargo.toml | sort -u)
          for want in libc; do
            echo "$deps" | grep -qx "$want" || { echo "::error::zrt lost $want"; exit 1; }
          done
          # Explicitly named because these are the ones an init must never
          # acquire: an async runtime in a PID-1 path is a scheduler bug, and
          # a logging framework is a second opinion about where logs go.
          for forbidden in tokio async-std smol nix rustix log env_logger tracing; do
            if echo "$deps" | grep -qx "$forbidden"; then
              echo "::error::zrt acquired $forbidden"
              exit 1
            fi
          done

      - name: No stdout in the PID 1 path
        # PID 1 has nowhere to print to: stdout is the console the service is
        # trying to hand over. Anything that writes to it in the init path is
        # a bug that only shows up as a blank screen.
        #
        # The one exception is `zrt::report`, the single sanctioned announcer
        # for backend degradations (DESIGN.md §8.1 demands they be announced).
        # Raw print macros are banned everywhere else — including test code,
        # which can fail with a message instead — so a stray print fails the
        # build instead of shipping. Doc comments (`//`) are prose, not code.
        #
        # `crates/zctl` is exempt: it is a CLI, not the PID-1 path, and
        # printing the reply is its entire job.
        run: |
          set -euo pipefail
          hits=$(grep -rn --include='*.rs' -E '\b(println!|eprintln!|dbg!)\s*\(' crates/ \
            | grep -v 'crates/zrt/src/report.rs' \
            | grep -v 'crates/zctl/' \
            | grep -vE ':[0-9]+:\s*//' \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::a print macro leaked outside zrt::report:"
            echo "$hits"
            exit 1
          fi
          echo "clean: the only announcer is zrt::report"

      - name: No foreign-init coupling in code
        # Scoped golden rule: the workspace must never *couple* to a foreign
        # init (dependency, module, adapter, config dialect). Prose may still
        # name them — DESIGN.md's audit history and the `//`-comment rationale
        # are the record of why each decision exists, and erasing that record
        # would destroy the review trail. So this step greps Rust *code* only
        # (comment lines filtered, same convention as the print-macro step).
        #
        # Grandfathered, and the only two allowed code mentions: both are
        # tests proving those names are *rejected* (a reserved service name,
        # a lint attribution string), not integrations.
        #   - crates/zconfig/src/desc.rs: reserved-name table ("dbus")
        #   - crates/zconfig/src/diagnostic.rs: "dinit-check bug" attribution
        # A new mention in code fails the build: put the translation in an
        # external plugin, never in this workspace.
        run: |
          set -euo pipefail
          hits=$(grep -rn --include='*.rs' -E 'systemd|runit|\bs6\b|openrc|dinit|dbus' crates/ \
            | grep -vE ':[0-9]+:\s*//' \
            | grep -v 'desc\.rs.*dbus' \
            | grep -v 'diagnostic\.rs.*dinit-check bug' \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::foreign init mentioned in code outside the allowlist:"
            echo "$hits"
            exit 1
          fi
          echo "clean: no foreign-init coupling in code"

  # ══════════════════════════════════════════════════════════════════════════
  # 7. Licence. GPL-3 is a promise about what happens to derivatives; it has
  #    to be consistent across every manifest, and the one dependency we have
  #    has to be compatible with it.
  # ══════════════════════════════════════════════════════════════════════════
  license:
    name: licence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Every manifest agrees
        run: |
          set -euo pipefail
          grep -q 'license = "GPL-3.0-or-later"' Cargo.toml \
            || { echo "::error::workspace license is not GPL-3.0-or-later"; exit 1; }
          for m in crates/*/Cargo.toml; do
            grep -q 'license.workspace = true' "$m" \
              || { echo "::error::$m does not inherit the workspace licence"; exit 1; }
          done

      - name: The LICENSE file is the real GNU text
        run: |
          set -euo pipefail
          head -2 LICENSE | grep -q 'GNU GENERAL PUBLIC LICENSE'
          grep -q 'Version 3, 29 June 2007' LICENSE
          [ "$(wc -l < LICENSE)" -gt 600 ] || { echo "LICENSE is truncated"; exit 1; }
          echo "GPL-3, $(wc -l < LICENSE) lines"

      - name: The one dependency is GPL-compatible
        # `libc` is MIT-or-Apache-2.0, which is one-way compatible with
        # GPL-3. If that ever changes, this job is what notices.
        #
        # Checked against the vendored registry copy, not the crates.io API:
        # the API rate-limits anonymous CI traffic (HTTP 403) and the answer
        # we need is already on disk after `cargo fetch`.
        run: |
          set -euo pipefail
          cargo fetch
          reg="${CARGO_HOME:-$HOME/.cargo}/registry/src"
          lic=$(grep -rh '^license' "$reg"/*/libc-*/Cargo.toml | head -1)
          echo "libc declares: $lic"
          echo "$lic" | grep -qE 'MIT|Apache-2\.0' \
            || { echo "::error::libc license changed: $lic"; exit 1; }
          echo "libc is compatible with GPL-3"

  # ══════════════════════════════════════════════════════════════════════════
  # 8. Size budget: the release binary must stay microscopic.
  #
  #    This job once measured three binaries that did not exist (`zinit` was
  #    lib-only: no `[[bin]]`, no `main.rs`), so it was removed as a green job
  #    measuring nothing. `crates/zinit/src/main.rs` exists now, so the gate is
  #    back: 1 MiB (1048576 bytes) for `target/release/zinit`, built with the
  #    workspace release profile (`panic="abort"`, `lto`, `opt-level="s"`,
  #    `strip`). The 1 MiB is the budget this gate enforced before its removal
  #    — not the 500 KiB the master plan once hoped for (measured: ~650 KiB
  #    with the control plane, generators and confinement on board). A breach
  #    means the binary acquired a dependency or a code path it must not
  #    have — shrink it, never raise the budget without a design note.
  # ══════════════════════════════════════════════════════════════════════════
  size:
    name: size budget (<1 MiB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-size-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-size-
      - name: Release build
        run: cargo build -p zinit --release
      - name: Enforce 1 MiB budget
        run: |
          set -euo pipefail
          bin=target/release/zinit
          size=$(stat -c%s "$bin")
          echo "zinit release binary: $size bytes (budget 1048576)"
          [ "$size" -le 1048576 ] \
            || { echo "::error::zinit binary is $size bytes, over the 1 MiB budget"; exit 1; }
      - name: Dependency tree is libc-only
        run: |
          set -euo pipefail
          cargo tree -p zinit --edges normal --prefix none | sort -u | tee tree.txt
          grep -qE '^libc v' tree.txt || { echo "::error::libc missing from zinit tree"; exit 1; }
          if grep -vE '^(zinit v|zcore v|zconfig v|zrt v|zservice v|libc v)' tree.txt | grep -q .; then
            echo "::error::zinit tree gained a third-party dependency:"
            grep -vE '^(zinit v|zcore v|zconfig v|zrt v|zservice v|libc v)' tree.txt
            exit 1
          fi
          echo "tree is workspace crates + libc only"

  # ══════════════════════════════════════════════════════════════════════════
  # 9. MSRV, docs, and a nightly smoke build.
  # ══════════════════════════════════════════════════════════════════════════
  msrv:
    name: msrv 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo build --workspace
      - run: cargo test --workspace

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  nightly:
    name: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      # Nightly is where a `no_std` core gets exercised by `miri` below, and
      # where a stable-only build failure shows up before it reaches users.
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  # `miri` catches the aliasing and UB that a `-D warnings` build cannot, and
  # this code base is full of `transmute`-free but pointer-adjacent lifetime
  # reasoning that deserves an interpreter rather than a optimiser.
  #
  # NOTE: `--lib` only, on purpose. The `properties` integration test runs tens
  # of thousands of randomized iterations; under miri (100-1000x slower) that
  # is a guaranteed timeout, not a test. The lib unit tests are the UB surface.
  miri:
    name: miri (core lib only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - run: |
          rustup toolchain install nightly --component miri
          cargo +nightly miri setup
      - name: Run
        run: cargo +nightly miri test -p zcore --lib

  # ══════════════════════════════════════════════════════════════════════════
  # Static musl release binary for hardware/VM testing (portado de
  # `feat/fase-1-cierre`). Produce el `zinit` estático que `scripts/`
  # `zinit-deploy.sh` empaqueta; el artifact vive 30 días por push.
  # ══════════════════════════════════════════════════════════════════════════
  release-musl:
    name: static musl release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build static musl release
        run: cargo build --release --target x86_64-unknown-linux-musl --workspace
      - name: Verify it is static
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/zinit
          file "$bin"
          # `file` prints "statically linked" on classic static builds and
          # "static-pie linked" on modern toolchains (rust 1.7x+ defaults to
          # static-PIE for musl): both are fully static, no libc.so needed.
          file "$bin" | grep -qE "statically linked|static-pie linked" \
            || { echo "::error::zinit is not statically linked"; exit 1; }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zinit-musl-x86_64
          path: target/x86_64-unknown-linux-musl/release/zinit
          retention-days: 30
