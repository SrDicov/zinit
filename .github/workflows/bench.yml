name: bench

# Benchmarks. No synthetic N-service harness exists yet (Phase 2+), so this
# measures what is measurable today — release build + release test-suite wall
# time — and uploads it per run. The >10% PR regression gate activates once
# the harness lands; until then this job is non-blocking by design (it must
# stay green, not aspirationally red).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  measure:
    name: release timing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-
      - name: Release build (timed)
        run: |
          /usr/bin/time -v cargo build --release --workspace 2>&1 | tee bench-build.log || cargo build --release --workspace
      - name: Release test suite (timed)
        run: |
          start=$(date +%s)
          cargo test --workspace --release
          echo "release_test_wall_s=$(( $(date +%s) - start ))" | tee bench-result.log
      - uses: actions/upload-artifact@v4
        with:
          name: bench-logs
          path: |
            bench-build.log
            bench-result.log
