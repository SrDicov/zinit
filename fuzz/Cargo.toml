[package]
name = "zinit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Detached from the workspace on purpose (`[workspace]` below): libfuzzer-sys
# is a test-only dependency of the fuzzer, and the workspace gate (`cargo
# tree -p zinit` is workspace crates + libc only) must never see it. This
# crate never ships, never publishes, never leaves CI.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
zconfig = { path = "../crates/zconfig" }

# cargo-fuzz builds each target as `cargo build --bin <target>`; without an
# explicit [[bin]] the manifest has no targets and the nightly libFuzzer job
# fails with "no targets specified in the manifest".
[[bin]]
name = "parse_service"
path = "fuzz_targets/parse_service.rs"
